<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7a1230">
<title>Wedding Invitation</title>
<meta name="description" content="You are warmly invited to our wedding. View events, venue, countdown and RSVP.">
<meta property="og:title" content="You are invited to our wedding">
<meta property="og:description" content="Join us in celebrating. Tap to see dates, venue and RSVP.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;700&family=Noto+Serif+Devanagari:wght@500;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--m:#7a1230;--r:#b3123a;--g:#d4a017;--c:#fff8ec;--tx:#3a1020;--mu:#8a6a5a;--f:'Poppins','Noto Serif Devanagari',sans-serif;--h:'Playfair Display','Noto Serif Devanagari',serif;--s:'Great Vibes','Noto Serif Devanagari',cursive}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--f);background:var(--c);color:var(--tx);line-height:1.65;overflow-x:hidden}
.top{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(122,18,48,.92);backdrop-filter:blur(6px)}
.top button{border:1.5px solid var(--g);background:none;color:#fff;font:600 13px var(--f);padding:6px 14px;border-radius:99px;cursor:pointer}
.top button.on{background:var(--g);color:var(--m)}
.top div{display:flex;gap:8px}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 20px 60px;color:#fff;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 0,rgba(212,160,23,.3),transparent 55%),linear-gradient(160deg,#5a0c24,#9b1840 55%,#7a1230)}
.hero::before,.hero::after{content:'';position:absolute;inset:14px;border:2px solid rgba(212,160,23,.55);border-radius:22px;pointer-events:none}
.hero::after{inset:22px;border-width:1px;opacity:.6}
.pet{position:absolute;top:-30px;color:#f9c6d0;opacity:.8;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.sh{color:var(--g);font:700 18px var(--h);letter-spacing:.05em;margin-bottom:18px}
.guest{background:rgba(255,255,255,.12);border:1px solid rgba(212,160,23,.6);border-radius:99px;padding:6px 18px;font-size:14px;margin-bottom:16px}
.sm{font-size:14px;max-width:420px;opacity:.92}
.names{font:clamp(46px,13vw,92px)/1.1 var(--s);color:#ffe9b0;margin:12px 0 4px}
.names i{display:block;font:500 22px var(--h);color:var(--g);font-style:normal}
.date{font:600 clamp(16px,4vw,22px) var(--h);letter-spacing:.06em;margin:6px 0 22px}
.cd{display:flex;gap:10px;justify-content:center;margin-bottom:22px}
.cd div{background:rgba(255,255,255,.1);border:1px solid rgba(212,160,23,.5);border-radius:14px;min-width:68px;padding:10px 6px}
.cd b{display:block;font:700 28px var(--h);color:#ffe9b0}.cd span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:12px 24px;font:600 15px var(--f);cursor:pointer;text-decoration:none;transition:.2s}
.b1{background:linear-gradient(135deg,#f4c542,#d4a017);color:var(--m)}.b2{background:#fff;color:var(--m);border:1.5px solid var(--g)}.b3{background:#25d366;color:#fff}
.btn:hover{transform:translateY(-2px)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.sec{max-width:760px;margin:0 auto;padding:56px 20px}
.sec h2{font:700 30px var(--h);color:var(--m);text-align:center;margin-bottom:8px}
.sec h2::after{content:'❀';display:block;color:var(--g);font-size:20px;margin-top:4px}
.sub{text-align:center;color:var(--mu);margin-bottom:24px}
.fam{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:center}
.fam div{background:#fff;border:1px solid #efd9b0;border-radius:16px;padding:18px}
.fam b{font:700 20px var(--h);color:var(--r);display:block}.fam span{font-size:13px;color:var(--mu)}
.tl{position:relative;padding-left:28px;border-left:2px dashed var(--g);margin-left:8px}
.ev{background:#fff;border:1px solid #efd9b0;border-radius:16px;padding:16px 18px;margin-bottom:16px;position:relative;box-shadow:0 6px 18px rgba(122,18,48,.06)}
.ev::before{content:'';position:absolute;left:-37px;top:22px;width:14px;height:14px;border-radius:50%;background:var(--r);border:3px solid var(--c);box-shadow:0 0 0 2px var(--g)}
.ev h3{font:700 19px var(--h);color:var(--m)}.ev p{font-size:14px;color:var(--mu)}.ev .t{color:var(--r);font-weight:600}
.map{border:0;width:100%;height:280px;border-radius:16px;margin-top:14px}
.vc{background:#fff;border:1px solid #efd9b0;border-radius:18px;padding:20px;text-align:center}
.vc h3{font:700 22px var(--h);color:var(--r)}
form{background:#fff;border:1px solid #efd9b0;border-radius:18px;padding:20px;display:grid;gap:12px}
label{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:12px 13px;border:1.5px solid #e8d4b0;border-radius:11px;font:500 15px var(--f);background:#fffdf8;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--r)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foot{background:var(--m);color:#f6dfc0;text-align:center;padding:34px 20px;font-size:14px}
.foot b{font:44px var(--s);color:#ffe9b0;display:block}
.rv{opacity:0;transform:translateY(24px);transition:.7s}.rv.in{opacity:1;transform:none}
#ed{position:fixed;inset:0;z-index:100;background:rgba(40,5,15,.6);display:none;align-items:flex-end;justify-content:center}
#ed.show{display:flex}
#ed .box{background:var(--c);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px;display:grid;gap:10px}
#ed h3{font:700 22px var(--h);color:var(--m)}
.note{font-size:12px;color:var(--mu)}
.how{counter-reset:s;display:grid;gap:12px;list-style:none}
.how li{background:#fff;border:1px solid #efd9b0;border-radius:14px;padding:14px 16px 14px 58px;position:relative;font-size:14.5px}
.how li::before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:12px;width:30px;height:30px;border-radius:50%;background:var(--r);color:#fff;display:grid;place-items:center;font:700 14px var(--h)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.fg div{background:#fff;border:1px solid #efd9b0;border-radius:14px;padding:12px 14px;font-size:14px}
.fg b{display:block;color:var(--m);font-family:var(--h)}
.info details{border-bottom:1px solid #efd9b0;padding:12px 0}.info summary{font-weight:600;cursor:pointer;color:var(--m)}.info details p{font-size:14px;color:var(--mu);margin-top:6px}
.info h3{font:700 22px var(--h);color:var(--m);margin:26px 0 12px;text-align:center}
.info{background:#fff3df;border-top:1px solid #efd9b0}
@media(max-width:520px){.fg{grid-template-columns:1fr}}
@media(max-width:520px){.two,.fam{grid-template-columns:1fr}.cd div{min-width:60px}.ev::before{left:-36px}}
</style>
</head>
<body>
<div class="top">
  <div><button id="bEn" onclick="setLang('en')">English</button><button id="bMr" onclick="setLang('mr')">मराठी</button></div>
  <button id="bEd" onclick="openEd()" style="display:none">✎ Customize</button>
</div>
<div id="app"></div>

<div id="footer"></div>

<script>
fetch("/footer.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("footer").innerHTML = data;
    var yearSpan = document.getElementById("year");
    if (yearSpan) {
      yearSpan.textContent = new Date().getFullYear();
    }
  });
</script>

<div id="ed" onclick="if(event.target===this)closeEd()">
 <div class="box">
  <h3>Customize your invitation</h3>
  <p class="note">Fill details, tap Preview, then copy the link and share it on WhatsApp. Everything is stored inside the link, no signup needed.</p>
  <div class="two"><div><label>Groom name</label><input id="e_groom"></div><div><label>Bride name</label><input id="e_bride"></div></div>
  <div class="two"><div><label>Groom family line</label><input id="e_f1"></div><div><label>Bride family line</label><input id="e_f2"></div></div>
  <div class="two"><div><label>Wedding date &amp; time</label><input type="datetime-local" id="e_dt"></div><div><label>RSVP WhatsApp (with 91)</label><input id="e_wa" inputmode="numeric" placeholder="919XXXXXXXXX"></div></div>
  <div><label>Venue name</label><input id="e_venue"></div>
  <div><label>Venue address</label><input id="e_addr"></div>
  <div><label>Events (one per line: Title | YYYY-MM-DDTHH:MM | Place)</label><textarea id="e_ev" rows="5"></textarea></div>
  <div><label>Welcome message (optional)</label><input id="e_msg"></div>
  <div><label>Guest name for personal link (optional)</label><input id="e_guest" placeholder="e.g. Sharma Family"></div>
  <div class="row"><button class="btn b1" onclick="applyEd()">Preview</button><button class="btn b3" onclick="copyLink()">Copy invitation link</button><button class="btn b2" onclick="closeEd()">Close</button></div>
 </div>
</div>

let cfg=Object.assign({},D),lang='en';

try{const d=q.get('d');if(d)Object.assign(cfg,JSON.parse(decodeURIComponent(escape(atob(d.replace(/-/g,'+').replace(/_/g,'/'))))))}catch(e){}
if(q.get('lang')==='mr')lang='mr';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>('0'+n).slice(-2);

const DO={weekday:'long',day:'numeric',month:'long',year:'numeric'},TO={hour:'numeric',minute:'2-digit'};
const mapQ=()=>encodeURIComponent(cfg.venue+' '+cfg.addr);

const I={

 c:'✎ Customize my invitation'},
mr:{t:'या मोफत लग्न पत्रिका टूलबद्दल माहिती',sub:'द्विभाषिक सुंदर आमंत्रण बनवा आणि लिंक म्हणून शेअर करा. साइनअप नाही, अ‍ॅप नाही.',h:'वापरण्याची पद्धत',

function info(){
 if(q.get('d')&&!q.has('edit'))return '';
 const i=I[lang];
 return '<section class="info"><div class="sec"><h2>'+i.t+'</h2><p class="sub">'+i.sub+'</p>'+

function render(){
 const t=T[lang],ev=cfg.ev.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a[0]);
 document.documentElement.lang=lang;document.title=cfg.groom+' & '+cfg.bride+' – Wedding Invitation';
 $('bEn').className=lang==='en'?'on':'';$('bMr').className=lang==='mr'?'on':'';
 let pet='';for(let i=0;i<14;i++)pet+='<span class="pet" style="left:'+(Math.random()*100)+'%;font-size:'+(12+Math.random()*14)+'px;animation-duration:'+(8+Math.random()*10)+'s;animation-delay:-'+(Math.random()*12)+'s">✿</span>';
 $('app').innerHTML=
 '<section class="hero">'+pet+
 '<div class="sh">|| श्री गणेशाय नमः ||</div>'+
 (guest?'<div class="guest">'+t.dear+' '+esc(guest)+', '+t.wel+'</div>':'')+
 '<p class="sm">'+t.top+'<br>'+t.inv+'</p>'+
 '<div class="names">'+esc(cfg.groom)+'<i>&amp;</i>'+esc(cfg.bride)+'</div>'+
 '<div class="date">'+fmt(cfg.dt,DO)+'</div>'+
 (cfg.msg?'<p class="sm" style="margin-bottom:18px">'+esc(cfg.msg)+'</p>':'')+
 '<div class="cd" id="cd"></div>'+
 '<div class="row"><a class="btn b1" href="#events">'+t.ev+'</a><a class="btn b2" href="#rsvp">'+t.rsvp+'</a></div></section>'+

 '<section class="sec rv"><h2>'+t.fam+'</h2><div class="fam"><div><b>'+esc(cfg.groom)+'</b><span>'+esc(cfg.f1)+'</span></div><div><b>'+esc(cfg.bride)+'</b><span>'+esc(cfg.f2)+'</span></div></div></section>'+

 '<section class="sec rv" id="events"><h2>'+t.ev+'</h2><p class="sub">'+t.evs+'</p><div class="tl">'+
 ev.map(a=>'<div class="ev"><h3>'+esc(a[0])+'</h3><p class="t">'+fmt(a[1],DO)+' · '+fmt(a[1],TO)+'</p><p>'+esc(a[2]||'')+'</p></div>').join('')+'</div></section>'+

 '<section class="sec rv" id="venue"><h2>'+t.ven+'</h2><div class="vc"><h3>'+esc(cfg.venue)+'</h3><p>'+esc(cfg.addr)+'</p><div class="row" style="margin-top:14px"><a class="btn b1" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+mapQ()+'">📍 '+t.map+'</a><a class="btn b2" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+mapQ()+'">🧭 '+t.dir+'</a></div></div>'+
 '<div id="mapBox" style="margin-top:14px;text-align:center"><button class="btn b2" onclick="showMap()">🗺️ '+t.pm+'</button></div>'+
 '<div class="row" style="margin-top:18px"><button class="btn b2" onclick="ics()">📅 '+t.cal+'</button><a class="btn b2" target="_blank" rel="noopener" href="'+gcal()+'">'+t.gc+'</a></div></section>'+

 '<section class="sec rv" id="rsvp"><h2>'+t.rsvp+'</h2><p class="sub">'+t.rs+'</p><form onsubmit="return rsvp(event)">'+
 '<div class="two"><div><label>'+t.nm+'</label><input id="r_n" required value="'+esc(guest)+'"></div><div><label>'+t.gs+'</label><select id="r_g">'+[1,2,3,4,5,6,7,8].map(n=>'<option value="'+n+'">'+n+'</option>').join('')+'</select></div></div>'+
 '<div><select id="r_a"><option value="y">'+t.yes+'</option><option value="n">'+t.no+'</option></select></div>'+
 '<div><label>'+t.ms+'</label><textarea id="r_m" rows="3"></textarea></div>'+
 '<button class="btn b3" type="submit">'+t.send+'</button></form>'+
 '<div class="row" style="margin-top:18px"><button class="btn b2" onclick="shareWA()">'+t.share+'</button></div></section>'+

 info()+'<footer class="foot"><b>'+esc(cfg.groom)+' &amp; '+esc(cfg.bride)+'</b>'+t.foot+' ♥</footer>';
 tick();document.querySelectorAll('.rv').forEach(e=>io.observe(e));
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.12});

function tick(){
 const t=T[lang],el=$('cd');if(!el)return;
 let ms=new Date(cfg.dt)-new Date();
 if(isNaN(ms))return;
 if(ms<=0){el.innerHTML='<div style="min-width:0;padding:10px 18px">'+t.done+'</div>';return}
 const d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;
 el.innerHTML=[[d,t.d],[h,t.h],[m,t.m],[s,t.s]].map(x=>'<div><b>'+p2(x[0])+'</b><span>'+x[1]+'</span></div>').join('');
}
setInterval(tick,1000);

function setLang(l){lang=l;render()}
function showMap(){
 const b=$('mapBox');
 b.innerHTML='<iframe class="map" title="Map" src="https://www.google.com/maps?q='+mapQ()+'&output=embed"></iframe><p class="note" style="margin-top:6px">'+T[lang].nomap+'</p>';
}

// calendar
const icd=d=>d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'T'+p2(d.getHours())+p2(d.getMinutes())+'00';
function range(){const s=new Date(cfg.dt),e=new Date(s.getTime()+4*36e5);return[icd(s),icd(e)]}
function gcal(){const r=range();return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(cfg.groom+' & '+cfg.bride+' – Wedding')+'&dates='+r[0]+'/'+r[1]+'&location='+mapQ()+'&details='+encodeURIComponent('You are invited to our wedding.')}
function ics(){
 const r=range(),txt=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Wedding Invitation//EN','BEGIN:VEVENT','UID:'+Date.now()+'@wedding','DTSTAMP:'+icd(new Date()),
 'DTSTART:'+r[0],'DTEND:'+r[1],'SUMMARY:'+cfg.groom+' & '+cfg.bride+' – Wedding','LOCATION:'+(cfg.venue+', '+cfg.addr).replace(/,/g,'\\,'),'END:VEVENT','END:VCALENDAR'].join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/calendar'}));a.download='wedding-invitation.ics';document.body.appendChild(a);a.click();a.remove();
}

// RSVP + share
function rsvp(e){
 e.preventDefault();const t=T[lang];
 if(!cfg.wa){alert(t.wait);return false}
 const a=$('r_a').value==='y';
 const msg='*Wedding RSVP* – '+cfg.groom+' & '+cfg.bride+'\n'+t.nm+': '+$('r_n').value+'\n'+(a?t.yes:t.no)+(a?'\n'+t.gs+': '+$('r_g').value:'')+($('r_m').value?'\n'+$('r_m').value:'');
 window.open('https://wa.me/'+cfg.wa.replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank');return false;
}
function shareWA(){window.open('https://wa.me/?text='+encodeURIComponent(cfg.groom+' & '+cfg.bride+' – Wedding Invitation\n'+location.href),'_blank')}

// editor
const F=['groom','bride','f1','f2','dt','wa','venue','addr','ev','msg'];
function openEd(){F.forEach(k=>$('e_'+k).value=cfg[k]||'');$('e_guest').value=guest;$('ed').classList.add('show')}
function closeEd(){$('ed').classList.remove('show')}
function applyEd(){F.forEach(k=>{const v=$('e_'+k).value.trim();if(v||k==='msg'||k==='wa')cfg[k]=v});render();closeEd();window.scrollTo(0,0)}
function link(){
 F.forEach(k=>{const v=$('e_'+k).value.trim();if(v||k==='msg'||k==='wa')cfg[k]=v});
 const b=btoa(unescape(encodeURIComponent(JSON.stringify(cfg)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 const g=$('e_guest').value.trim();
 return location.origin.replace('null','')+location.pathname+'?d='+b+(g?'&guest='+encodeURIComponent(g):'')+(lang==='mr'?'&lang=mr':'');
}
function copyLink(){
 const u=link(),t=T[lang];
 (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>alert(t.cp)).catch(()=>prompt('Copy this link:',u));
}
if(!q.get('d')||q.has('edit'))$('bEd').style.display='';
render();
</script>
</body>
</html>
