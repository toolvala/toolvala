.sh{color:#ffe9b0;font:700 18px var(--h);margin-bottom:16px}

 const W=1080,P=96,mw=W-2*P-40,cs=getComputedStyle(document.documentElement),col=n=>cs.getPropertyValue('--'+n).trim();
 const items=cardItems(),cv=document.createElement('canvas'),ctx=cv.getContext('2d'),font=i=>i.w+' '+i.s+'px '+i.fam;
 items.forEach(i=>{i.s0=i.s;if(i.fit){ctx.font=font(i);while(i.s>48&&wrapT(ctx,i.t,mw).some(l=>ctx.measureText(l).width>mw)){i.s-=4;ctx.font=font(i)}}});
 const pass=draw=>{let y=P+70;items.forEach(i=>{ctx.font=font(i);ctx.fillStyle=i.c;ctx.textAlign='center';ctx.textBaseline='alphabetic';const lh=i.lh*i.s/i.s0;wrapT(ctx,i.t,mw).forEach(l=>{y+=lh;if(draw)ctx.fillText(l,W/2,y-lh*.22)});y+=i.gap});return y+P};
 const H=Math.max(1528,Math.round(pass(false)));cv.width=W;cv.height=H;
 const gr=ctx.createLinearGradient(0,0,W*.3,H);gr.addColorStop(0,col('m')||'#7a1230');gr.addColorStop(1,col('r')||'#b3123a');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle=col('g')||'#d4a017';ctx.lineWidth=6;rr(ctx,36,36,W-72,H-72,44);ctx.stroke();ctx.lineWidth=2;ctx.globalAlpha=.6;rr(ctx,56,56,W-112,H-112,32);ctx.stroke();ctx.globalAlpha=1;
 pass(true);return cv;
}
function pdfFromJpeg(dataUrl,w,h){
 const bin=atob(dataUrl.split(',')[1]),img=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)img[i]=bin.charCodeAt(i);
 const PW=420,PH=Math.round(420*h/w),enc=new TextEncoder(),parts=[],offs=[];let len=0;
 const push=u=>{parts.push(u);len+=u.length},str=s=>push(enc.encode(s)),obj=(n,b)=>{offs[n]=len;str(n+' 0 obj\n'+b+'\nendobj\n')};
 str('%PDF-1.4\n');
 obj(1,'<</Type/Catalog/Pages 2 0 R>>');obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
 obj(3,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+PW+' '+PH+']/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>');
 offs[4]=len;str('4 0 obj\n<</Type/XObject/Subtype/Image/Width '+w+'/Height '+h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+img.length+'>>\nstream\n');push(img);str('\nendstream\nendobj\n');
 const c='q '+PW+' 0 0 '+PH+' 0 0 cm /Im0 Do Q';obj(5,'<</Length '+c.length+'>>\nstream\n'+c+'\nendstream');
 const x=len;str('xref\n0 6\n0000000000 65535 f \n');for(let n=1;n<=5;n++)str(String(offs[n]).padStart(10,'0')+' 00000 n \n');
 str('trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n'+x+'\n%%EOF');
 return new Blob(parts,{type:'application/pdf'});
}
function save(href,name){const a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function dlImg(){const cv=await cardCanvas();save(cv.toDataURL('image/jpeg',.92),'invitation-card.jpg')}
async function dlPdf(){const cv=await cardCanvas();save(URL.createObjectURL(pdfFromJpeg(cv.toDataURL('image/jpeg',.92),cv.width,cv.height)),'invitation-card.pdf')}

 const t=T[lang],g='#ffe9b0',w='#ffffff',it=[],ev=(cfg.ev||'').split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a[0]).slice(0,6);

 if(ev.length){it.push({t:t.prog,s:34,w:700,fam:FS,c:g,lh:52,gap:4});ev.forEach(a=>it.push({t:a[0]+' · '+fr(a[1],{day:'numeric',month:'short'})+', '+fr(a[1],TO)+(a[2]?' · '+a[2]:''),s:26,w:500,fam:FP,c:w,lh:38,gap:2}));it[it.length-1].gap=22}
 famItems(it,t,g,w);
 if(cfg.msg)it.push({t:cfg.msg,s:28,w:500,fam:FS,c:w,lh:42,gap:18});
 it.push({t:'Made with Toolvala.in',s:22,w:400,fam:FP,c:'rgba(255,255,255,.65)',lh:34,gap:0});
 return it;
}
